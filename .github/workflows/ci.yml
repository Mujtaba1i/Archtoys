# Builds and tests every push to main and every pull request, so problems
# (including a Cargo.lock that is out of date after a version bump, which
# makes `--locked` fail) show up before you tag a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Real picks on a virtual X11 screen split into two monitors: arrow keys,
      # Enter, a click and Esc, at the edge between the monitors and in the
      # corner (the monitor maths itself is covered by the unit tests above).
      - name: Pick on two monitors (X11)
        run: |
          sudo apt-get install -y xvfb x11-xserver-utils xdotool feh picom dbus \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 fonts-dejavu-core
          bash .github/scripts/x11-pick-test.sh target/debug/archtoys

      # Text Extractor: known text drawn at screen sizes, light and dark, in
      # English, German and Russian, read by the real Tesseract through the
      # app (`archtoys --extract-file`). The run summary shows how much came
      # back right, the language named, how sure and how fast. English at
      # 14 px and up, and Arabic, must come back at least 90% right.
      - name: Text Extractor accuracy
        run: |
          sudo apt-get install -y tesseract-ocr imagemagick fonts-dejavu-core fonts-liberation2 fonts-noto-core pango1.0-tools
          python3 .github/scripts/ocr_accuracy.py target/debug/archtoys

      # Every library must have a licence an MIT app can use and ship.
      - name: Licences
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

      # Color search must answer each keystroke in under 2 ms. This is a
      # report, not a gate: shared runners vary in speed, so a slow run shows a
      # warning and the timings in the run's summary instead of failing CI
      # (which would also hold back a release).
      - name: Search speed (under 2 ms per keystroke)
        run: |
          set +e
          out=$(cargo test --locked --release search::tests::speed -- --ignored --nocapture 2>&1)
          status=$?
          set -e
          worst=$(grep -oP '^worst: \K[0-9.]+' <<<"$out" || true)
          slowest=$(grep -P '^\s*[0-9.]+ ms ' <<<"$out" | sort -rn | head -5 || true)
          {
            if [ -z "$worst" ]; then
              echo "### ⚠️ Search speed: the test didn't run"
              echo '```'; tail -n 30 <<<"$out"; echo '```'
            elif [ "$status" -eq 0 ]; then
              echo "### ✅ Search speed: slowest keystroke ${worst} ms (budget 2 ms; each the median of 7 timings)"
            else
              echo "### ⚠️ Search speed: slowest keystroke ${worst} ms, over the 2 ms budget (each the median of 7 timings)"
            fi
            if [ -n "$slowest" ]; then
              echo; echo "Slowest keystrokes (time, results, text typed so far):"
              echo '```'; echo "$slowest"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$worst" ]; then
            echo "::warning title=Search speed::The speed test didn't run; see the run summary"
          elif [ "$status" -ne 0 ]; then
            echo "::warning title=Search speed::Slowest keystroke took ${worst} ms (budget 2 ms); see the run summary"
          fi

      - name: Check PKGBUILDs parse
        run: |
          bash -n packaging/aur-archtoys/PKGBUILD
          bash -n packaging/aur-archtoys-bin/PKGBUILD

      - name: Test the release scripts
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
          python3 -m unittest discover -v -s .github/scripts -p 'test_*.py'

  # Text Extractor's "Turn on" on each family it supports: the app's exact
  # install script (kept equal by a unit test) as root in a clean container,
  # with nothing installed and with an older Tesseract already there.
  tesseract-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "archlinux:latest", distro: arch }
          - { image: "fedora:latest", distro: fedora }
          - { image: "ubuntu:22.04", distro: debian }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Turn on with nothing installed
        run: bash .github/scripts/tesseract-install-test.sh "${{ matrix.image }}" "${{ matrix.distro }}"
      - name: Turn on with an older Tesseract already there
        run: bash .github/scripts/tesseract-install-test.sh "${{ matrix.image }}" "${{ matrix.distro }}" preinstalled
