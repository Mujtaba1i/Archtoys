# Builds and tests every push to main and every pull request, so problems
# (including a Cargo.lock that is out of date after a version bump, which
# makes `--locked` fail) show up before you tag a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Check PKGBUILDs parse
        run: |
          bash -n packaging/aur-archtoys/PKGBUILD
          bash -n packaging/aur-archtoys-bin/PKGBUILD
