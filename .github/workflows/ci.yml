# Builds and tests every push to main and every pull request, so problems
# (including a Cargo.lock that is out of date after a version bump, which
# makes `--locked` fail) show up before you tag a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      # Real picks on a virtual X11 screen split into two monitors: arrow keys,
      # Enter, a click and Esc, at the edge between the monitors and in the
      # corner (the monitor maths itself is covered by the unit tests above).
      - name: Pick on two monitors (X11)
        run: |
          sudo apt-get install -y xvfb x11-xserver-utils xdotool feh picom dbus \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 fonts-dejavu-core
          bash .github/scripts/x11-pick-test.sh target/debug/archtoys

      # Text Extractor: known text drawn at screen sizes, light and dark, in
      # English, German and Russian, read by the real Tesseract through the
      # app (`archtoys --extract-file`). The run summary shows how much came
      # back right, the language named, how sure and how fast: one line per
      # text, then only the cases that went wrong (with each language's score).
      # English at 14 px and up must come back 90% right; Arabic below that warns.
      # A release build, so the times are the app's: a debug build reads images
      # several times slower (the search speed step below reuses its libraries).
      - name: Text Extractor accuracy
        run: |
          sudo apt-get install -y tesseract-ocr imagemagick fonts-dejavu-core fonts-liberation2 fonts-noto-core pango1.0-tools
          cargo build --release --locked
          python3 .github/scripts/ocr_accuracy.py target/release/archtoys

      # The app used like a person would (in CI since v0.7.4): a real mouse and
      # keyboard on a virtual X11 screen pick colors, search, open the editor,
      # the formats panel, Settings and the sidebar, extract text and open
      # Report a problem. Each check is verified by what a user gets
      # (config.json, the clipboard, pixels, files), never by the app reporting
      # on itself. Every check runs, the run summary lists them, and the step
      # fails if any failed. (Slint 1.18 cut the end of Settings off: this caught it.)
      - name: End to end (the app used like a person would)
        run: |
          sudo apt-get install -y xclip python3-xlib python3-pil openbox
          dbus-run-session -- python3 .github/scripts/e2e_test.py target/release/archtoys

      # Every library must have a licence an MIT app can use and ship.
      - name: Licences
        run: |
          cargo install cargo-deny --locked
          cargo deny check licenses

      # Color search must answer each keystroke in under 2 ms. This is a
      # report, not a gate: shared runners vary in speed, so a slow run shows a
      # warning and the timings in the run's summary instead of failing CI
      # (which would also hold back a release).
      - name: Search speed (under 2 ms per keystroke)
        run: |
          set +e
          out=$(cargo test --locked --release search::tests::speed -- --ignored --nocapture 2>&1)
          status=$?
          set -e
          worst=$(grep -oP '^worst: \K[0-9.]+' <<<"$out" || true)
          slowest=$(grep -P '^\s*[0-9.]+ ms ' <<<"$out" | sort -rn | head -5 || true)
          {
            if [ -z "$worst" ]; then
              echo "### ⚠️ Search speed: the test didn't run"
              echo '```'; tail -n 30 <<<"$out"; echo '```'
            elif [ "$status" -eq 0 ]; then
              echo "### ✅ Search speed: slowest keystroke ${worst} ms (budget 2 ms; each the median of 7 timings)"
            else
              echo "### ⚠️ Search speed: slowest keystroke ${worst} ms, over the 2 ms budget (each the median of 7 timings)"
            fi
            if [ -n "$slowest" ]; then
              echo; echo "Slowest keystrokes (time, results, text typed so far):"
              echo '```'; echo "$slowest"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$worst" ]; then
            echo "::warning title=Search speed::The speed test didn't run; see the run summary"
          elif [ "$status" -ne 0 ]; then
            echo "::warning title=Search speed::Slowest keystroke took ${worst} ms (budget 2 ms); see the run summary"
          fi

      - name: Check PKGBUILDs parse
        run: |
          bash -n packaging/aur-archtoys/PKGBUILD
          bash -n packaging/aur-archtoys-bin/PKGBUILD

      - name: Test the release scripts
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
          # without the run summary: the scripts under test write their fake
          # releases there (they showed up as "COPR: build #5 for 0.3.1")
          env -u GITHUB_STEP_SUMMARY python3 -m unittest discover -v -s .github/scripts -p 'test_*.py'

      # Code and project checks (v0.7.3). Each one is its own step that runs
      # even when an earlier one failed, and writes a row to the run summary:
      # what it checks, passed or not, and for a failure what it found and what
      # to do (.github/scripts/check.sh).
      - name: "Checks: summary table"
        if: ${{ !cancelled() }}
        run: printf '### Code and project checks\n\n| | Check | What it checks |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

      - name: "Code: formatting (cargo fmt)"
        if: ${{ !cancelled() }}
        run: >-
          bash .github/scripts/check.sh "Formatting" "The code is formatted the same way everywhere (cargo fmt, settings in rustfmt.toml)"
          "Run cargo fmt and commit the result. The lines below show where the code differs."
          --keep '^(Diff in|[-+])' -- cargo fmt --check

      - name: "Code: common Rust mistakes (clippy)"
        if: ${{ !cancelled() }}
        run: >-
          bash .github/scripts/check.sh "Common mistakes" "Clippy finds no common Rust mistakes (warnings count as failures)"
          "Each item below names the file and line and what clippy suggests; run cargo clippy --all-targets locally to see them, fix, and push."
          --keep '^(warning|error)|-->|= help' -- cargo clippy --locked --all-targets -- -D warnings

      - name: "Software centers: the metainfo and .desktop file are valid"
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          rc=0  # every check here runs and reports, then the step fails if one did
          bash .github/scripts/check.sh "Software centers" "The AppStream metainfo (what KDE Discover and GNOME Software show) is valid" \
            "Fix the lines named below in packaging/io.github.Mujtaba1i.Archtoys.metainfo.xml." \
            -- appstreamcli validate --no-net --explain packaging/io.github.Mujtaba1i.Archtoys.metainfo.xml || rc=1
          bash .github/scripts/check.sh "Desktop file" "packaging/archtoys.desktop is valid (the app menu entry)" \
            "Fix the keys named below in packaging/archtoys.desktop." \
            --keep 'error' -- desktop-file-validate packaging/archtoys.desktop || rc=1
          exit $rc

      - name: "Buy me a coffee: every button points at the same support page"
        if: ${{ !cancelled() }}
        run: |
          rc=0  # every check here runs and reports, then the step fails if one did
          bash .github/scripts/check.sh "Support page" "The app, README, FUNDING.yml and metainfo all point at the same support page, and it works with and without a Ko-fi link" \
            "Make every address equal to SUPPORT_URL in src/launch.rs (the lines below say which one differs)." \
            -- python3 .github/scripts/check_support.py || rc=1
          bash .github/scripts/check.sh "Ko-fi Worker" "The Cloudflare Worker passes supporters on correctly: right and wrong Ko-fi code, private supporters, Ko-fi's test, bad input, an expired GitHub token" \
            "The failing case is named below; fix support/kofi-worker.js, then paste the new file into the Worker on Cloudflare." \
            -- node support/kofi-worker.test.mjs || rc=1
          # a warning only: a website being down must never hold back a release
          bash .github/scripts/check.sh "Ko-fi page" "The Ko-fi page the support page forwards to exists" \
            "Open the Ko-fi link in docs/support/index.html: if the page is gone, change the link (or empty it to pause support)." \
            --warn -- bash -c 'link=$(grep -oP "<a id=\"kofi\" href=\"\K[^\"]*" docs/support/index.html); [ -z "$link" ] && exit 0; code=$(curl -s -o /dev/null -w "%{http_code}" -A "archtoys-ci" "$link"); echo "$link answered HTTP $code"; [ "$code" != 404 ] && [ "$code" -lt 500 ]'
          exit $rc

      # A crate with a known security hole fails CI (the RustSec database);
      # the summary names the crate, the hole and the version that fixes it.
      - name: "Security: no library with a known security hole (cargo deny advisories)"
        if: ${{ !cancelled() }}
        run: >-
          bash .github/scripts/check.sh "Security advisories" "No library Archtoys uses has a known security hole (RustSec)"
          "Update the library named below: cargo update -p NAME (the Solution line gives the version that fixes it), run the tests, commit Cargo.lock."
          --keep '^(error|warning)\[|= (ID|Advisory|Solution|Announcement)|^[0-9]+ │' -- cargo deny check advisories

  # A pull request's speed and memory against main's (a Dependabot update of
  # Slint or winit, or a feature): the same benchmark as after a release
  # (bench.sh), both built here. It reports in the run summary, never fails.
  benchmark:
    name: "Benchmark: this pull request vs main"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev \
            libxkbcommon-x11-0 libxcursor1 libxi6 fonts-dejavu-core xvfb xdotool tesseract-ocr time

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # both in the same target folder, so main's build reuses the libraries
      - name: Build this pull request and main
        run: |
          cargo build --release --locked
          cp target/release/archtoys "$RUNNER_TEMP/archtoys-pr"
          git worktree add "$RUNNER_TEMP/main" "origin/${{ github.base_ref }}"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/main/Cargo.toml" --target-dir target
          cp target/release/archtoys "$RUNNER_TEMP/archtoys-main"

      - name: Benchmark
        env:
          NEW_LABEL: this pull request
          OLD_LABEL: ${{ github.base_ref }}
          RUNS: 5
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            bash .github/scripts/bench.sh "$RUNNER_TEMP/archtoys-pr" "$RUNNER_TEMP/archtoys-main"

  # KDE Plasma on Wayland, on a headless KWin: Plasma 5 on the runner (Ubuntu
  # 24.04 has 5.27), Plasma 6 in a Fedora container (they differ: KWin 6 holds
  # a script's move back while a size change waits for the app). Each step
  # writes what it checked and whether it passed to the run summary.
  # - the main window opens where it was closed (issue #11): Archtoys' KWin
  #   script; moved, closed, opened again, started fresh with a saved place
  # - the color picker gets ready on 1 and 2 monitors (issue #12: two
  #   monitors stayed black)
  kde-wayland:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev libxkbcommon-dev \
            libxkbcommon-x11-0 kwin-wayland qdbus-qt5 dbus

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked

      - name: "KDE Plasma 5 (Wayland): the window opens where it was closed"
        run: bash .github/scripts/kwin-place-test.sh target/debug/archtoys

      - name: "KDE Plasma 5 (Wayland): the color picker gets ready on 1 and 2 monitors"
        run: bash .github/scripts/kwin-pick-test.sh target/debug/archtoys

      # privileged: KWin's binary has a file capability a plain container can't run
      - name: "KDE Plasma 6 (Wayland, Fedora): the window opens where it was closed"
        run: |
          docker run --rm --privileged -v "$PWD:/w" -w /w \
            -v "$GITHUB_STEP_SUMMARY:/summary.md" -e GITHUB_STEP_SUMMARY=/summary.md fedora:latest bash -c '
            dnf install -y -q kwin qt6-qttools dbus-daemon fontconfig libX11 libxkbcommon libxkbcommon-x11 >/dev/null
            bash .github/scripts/kwin-place-test.sh target/debug/archtoys'

      - name: "KDE Plasma 6 (Wayland, Fedora): the color picker gets ready on 1 and 2 monitors"
        run: |
          docker run --rm --privileged -v "$PWD:/w" -w /w \
            -v "$GITHUB_STEP_SUMMARY:/summary.md" -e GITHUB_STEP_SUMMARY=/summary.md fedora:latest bash -c '
            dnf install -y -q kwin dbus-daemon python3 fontconfig libX11 libxkbcommon libxkbcommon-x11 >/dev/null
            bash .github/scripts/kwin-pick-test.sh target/debug/archtoys'

  # Text Extractor's "Turn on" on each family it supports: the app's exact
  # install script (kept equal by a unit test) as root in a clean container,
  # with nothing installed and with an older Tesseract already there.
  tesseract-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "archlinux:latest", distro: arch }
          - { image: "fedora:latest", distro: fedora }
          - { image: "ubuntu:22.04", distro: debian }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Turn on with nothing installed
        run: bash .github/scripts/tesseract-install-test.sh "${{ matrix.image }}" "${{ matrix.distro }}"
      - name: Turn on with an older Tesseract already there
        run: bash .github/scripts/tesseract-install-test.sh "${{ matrix.image }}" "${{ matrix.distro }}" preinstalled
