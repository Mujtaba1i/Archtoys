name: Upload COPR RPMs to GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual execution from the Actions tab

jobs:
  upload-rpms:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch and Upload COPR RPMs
        uses: karellen/copr-to-gh-release@main
        with:
          copr-owner-name: mujtaba1i
          copr-project-name: archtoys
          copr-package-name: Archtoys        # Matches the actual capitalized RPM package name
          tag-regex: '^v(?P<version>.*)$'    # Strips 'v' so tag v0.2.2 correctly maps to RPM version 0.2.2
          clobber-assets: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}