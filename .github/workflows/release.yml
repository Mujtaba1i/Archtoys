# The whole release, started by pushing a tag like v1.2.3. You only:
#
#     git tag v1.2.3
#     git push origin main v1.2.3
#
#   wait-for-ci ── prepare ──┬─ build-tarball ─┬─ build-appimage ─┬─ publish-release ─┬─ aur-bin
#                            │                 │  (+ tarball) ────┘                   ├─ aur-source
#                            ├─ trigger-copr ──┼──────────────────────────────────────┴─ copr-watch
#                            │                 └─ build-deb ── (optional) ─ attach-deb (after publish-release) ─ apt-repo
#
# build-tarball builds the app once (from main's CI cache); the AppImage and
# the .deb pack that same binary.
#   report (always runs last: summary table; opens an issue if anything failed)
#
# Required parts stop the release if they fail. Optional parts (the .deb, the APT repository) never
# do: the release is still published, and the report tells you what is missing.
# COPR can queue for hours, so "copr-watch" only starts a separate workflow
# (copr-watch.yml) that follows COPR's build and attaches the RPMs by itself.
#
# "wait-for-ci" waits until CI has passed for the tagged commit, so you can
# push commits and the tag together; if CI fails, nothing is changed.
# "prepare" sets the version in Cargo.toml / Cargo.lock / archtoys.spec,
# writes the changelog from your commit messages since the previous tag,
# commits "Release v1.2.3" to main and moves the tag onto that commit.
# Every later job builds that commit.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Name used in archtoys.spec %changelog entries
  PACKAGER: "Mujtaba1i <mujtaba1i@github>"

jobs:
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read     # read the CI run's status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the pushed commit: "prepare" moves the tag to the release commit,
          # and checkout v7 refuses a tag that moved since the run started
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-ci.sh

  prepare:
    name: Bump version + changelog
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the "Release vX" commit and moves the tag
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      notes: ${{ steps.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # full history + tags, for the changelog

      - id: prepare
        env:
          MAIN_PUSH_KEY: ${{ secrets.MAIN_PUSH_KEY }}   # past the Require CI rule (push-main.sh)
        run: bash .github/scripts/prepare-release.sh

  build-tarball:
    name: Build binary tarball
    needs: prepare
    # Oldest supported Ubuntu LTS, so the binary runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # A tag can't read an earlier tag's cache, but it reads main's: CI's Build
      # job saves one under the same shared key on the same Ubuntu. Saving one
      # here would only fill GitHub's 10 GB cache storage.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-2204
          save-if: false

      # No `cargo test` here: CI already ran the tests on this code, and the
      # release waits for CI to pass first (the wait-for-ci job).
      # The licence list shown in Settings > About, made for exactly this build.
      # cargo-about's own ready-made build, checked against its SHA-256
      # (compiling it took over 2 minutes).
      - name: Licence list
        run: |
          curl -fsSL -o cargo-about.tar.gz \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
          echo "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4  cargo-about.tar.gz" | sha256sum -c -
          tar -xzf cargo-about.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-about'
          rm cargo-about.tar.gz
          cargo about generate about.hbs -o data/third-party-licenses.html

      - name: Build release binary
        run: cargo build --release --locked

      # The AppImage catalog (and older distros) run on Ubuntu 22.04 = glibc 2.35.
      # Fail here rather than ship a binary that crashes on those systems.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T target/release/archtoys | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "Binary requires glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::Binary needs glibc $NEED, newer than 2.35 (Ubuntu 22.04). Build on ubuntu-22.04."
            exit 1
          fi

      # Ships the binary plus LICENSE, .desktop and icons, so the archtoys-bin
      # PKGBUILD can take everything from this one download.
      - name: Create release archive
        run: |
          mkdir -p staging
          install -Dm755 target/release/archtoys      staging/archtoys
          install -Dm644 LICENSE                      staging/LICENSE
          install -Dm644 data/colornames-LICENSE.txt  staging/colornames-LICENSE.txt
          install -Dm644 packaging/archtoys.desktop   staging/archtoys.desktop
          install -Dm644 packaging/io.github.Mujtaba1i.Archtoys.metainfo.xml staging/io.github.Mujtaba1i.Archtoys.metainfo.xml
          cp packaging/archtoys.png packaging/archtoys-*.png staging/
          (cd staging && tar -czf ../archtoys-linux-x86_64.tar.gz *)
          tar -tzf archtoys-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: archtoys-linux-x86_64.tar.gz
          if-no-files-found: error

      # The one build every package ships: the AppImage and .deb jobs take it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary
          path: target/release/archtoys
          if-no-files-found: error

  build-appimage:
    name: Build + smoke-test AppImage
    needs: [prepare, build-tarball]
    # Oldest supported Ubuntu LTS: the AppImage catalog tests on 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libxkbcommon*, libxcursor1, libxi6, libxrender1: bundled into the AppImage
          # xvfb: for the smoke test
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev curl \
            libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxi6 libxrender1 xvfb

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: target/release

      - name: Build AppImage
        env:
          ARCHTOYS_PREBUILT: "1"
        run: |
          chmod +x packaging/build-appimage.sh target/release/archtoys
          ./packaging/build-appimage.sh "${{ needs.prepare.outputs.version }}"

      # The AppImage catalog (and older distros) run on Ubuntu 22.04 = glibc 2.35.
      # Checks the binary AND the libraries bundled next to it.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T dist/AppDir/usr/bin/archtoys-bin dist/AppDir/usr/lib/*.so* 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "AppImage contents require glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::AppImage needs glibc $NEED, newer than 2.35 (Ubuntu 22.04). Build on ubuntu-22.04."
            exit 1
          fi

      # Start the finished AppImage on a virtual screen and make sure it is
      # still running after 10 seconds, like the AppImage catalog's test.
      - name: Smoke test AppImage
        run: |
          APPIMAGE="$(ls dist/Archtoys-*-x86_64.AppImage)"
          chmod +x "$APPIMAGE"
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$(mktemp -d)"
          Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:99 "$APPIMAGE" > smoke.log 2>&1 &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "AppImage is still running after 10 s: OK"
            kill "$APP_PID" || true
            kill "$XVFB_PID" || true
          else
            echo "::error::The AppImage exited within 10 seconds. Its output:"
            cat smoke.log
            kill "$XVFB_PID" || true
            exit 1
          fi
          cat smoke.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/Archtoys-*-x86_64.AppImage
          if-no-files-found: error

  # OPTIONAL. If anything in here fails, the release is still published and the
  # report says only the .deb is missing. Every step has its own name because
  # the failure report explains each one.
  build-deb:
    name: Build + test the .deb (optional)
    needs: [prepare, build-tarball]
    # Oldest supported Ubuntu LTS, so one .deb works on Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install the packaging tool
        run: cargo install cargo-deb --locked --version 3.8.0

      # The build the tarball job made (and checked for glibc 2.35).
      - name: Get the built app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary
          path: target/release

      - name: Create the .deb
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x target/release/archtoys
          cargo deb --no-build --deb-revision "" --output "archtoys_${VERSION}_amd64.deb"
          ls -la archtoys_*.deb

      - name: Check dependencies and files
        run: bash .github/scripts/check-deb.sh archtoys_*.deb

      # A clean Ubuntu with nothing installed, like a new user's machine.
      - name: Install on a clean Ubuntu
        run: |
          docker run -d --name clean ubuntu:22.04 sleep 3600
          docker cp archtoys_*.deb clean:/tmp/archtoys.deb
          # mirror_try: a slow Ubuntu server switches to Azure's mirror
          docker cp .github/scripts/mirror-try.sh clean:/tmp/mirror-try.sh
          docker exec clean bash -c '. /tmp/mirror-try.sh && mirror_try apt-get update -qq && DEBIAN_FRONTEND=noninteractive mirror_try apt-get install -y -qq /tmp/archtoys.deb xvfb'

      # The installed app must still be running after 10 seconds, like the
      # AppImage smoke test.
      - name: Start the installed app
        run: |
          docker exec clean bash -c '
            export HOME="$(mktemp -d)"
            Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
            sleep 2
            DISPLAY=:99 archtoys > /tmp/smoke.log 2>&1 &
            APP=$!
            sleep 10
            if kill -0 "$APP" 2>/dev/null; then
              echo "The installed app is still running after 10 s: OK"
            else
              echo "::error::The installed app exited within 10 seconds. Its output:"
              cat /tmp/smoke.log
              exit 1
            fi
            cat /tmp/smoke.log'

      - name: Clean up
        if: always()
        run: docker rm -f clean || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: archtoys_*.deb
          if-no-files-found: error

  # The only job that creates/edits the GitHub release, so two jobs can never
  # race to create it.
  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-tarball, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only what users download: the run also holds the bare binary the
      # AppImage and .deb jobs share (it was attached to v0.8.1 by mistake)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: artifacts

      - run: ls -la artifacts

      # SHA256SUMS, so users and packagers can check their downloads
      # (sha256sum -c SHA256SUMS); the .deb is added when it's attached
      - name: Checksums
        run: |
          cd artifacts
          ls | grep -vx SHA256SUMS | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Archtoys ${{ github.ref_name }}
          body: ${{ needs.prepare.outputs.notes }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # OPTIONAL. Adds the .deb to the release once it exists. Skipped when the
  # .deb failed to build.
  attach-deb:
    name: Attach the .deb to the release (optional)
    needs: [publish-release, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: deb

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" deb/*.deb --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add the .deb to SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS -D sums --repo "$GITHUB_REPOSITORY"
          (cd deb && sha256sum ./*.deb | sed 's# \./# #') >> sums/SHA256SUMS
          cat sums/SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" sums/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # OPTIONAL (v0.9.0). Adds the .deb to the APT repository: the repo
  # Mujtaba1i/archtoys-apt, served by GitHub Pages, signed with the
  # APT_GPG_PRIVATE_KEY secret (APT_GPG_PASSPHRASE if the key has one) and
  # pushed with the APT_REPO_KEY deploy key. Skipped until those secrets exist.
  apt-repo:
    name: Update the APT repository (optional)
    needs: [attach-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APT_REPO_KEY: ${{ secrets.APT_REPO_KEY }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Check the secrets
        id: secrets
        run: |
          if [ -z "$APT_REPO_KEY" ] || [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "The APT repository isn't set up yet (APT_REPO_KEY and APT_GPG_PRIVATE_KEY secrets), so it was skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          path: archtoys

      - name: Get the APT repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Mujtaba1i/archtoys-apt
          ssh-key: ${{ secrets.APT_REPO_KEY }}
          path: apt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: deb
          path: deb

      - name: Add the .deb and sign the index
        if: steps.secrets.outputs.ready == 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y -qq apt-utils
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          bash archtoys/.github/scripts/apt-repo.sh deb/*.deb apt

      - name: Publish it
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Archtoys ${GITHUB_REF_NAME#v}"
          git push origin HEAD
          echo "APT repository updated to ${GITHUB_REF_NAME#v}: https://mujtaba1i.github.io/archtoys-apt" >> "$GITHUB_STEP_SUMMARY"

  # Starts COPR's build once the release commit and tag exist. It first looks
  # at COPR's queue: a build of this release that is already queued or running
  # (for example you pressed Rebuild yourself) means no second build is sent, and
  # an older build still in the queue is named in the summary.
  trigger-copr:
    name: Start COPR build
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the pushed commit: "prepare" moves the tag to the release commit,
          # and checkout v7 refuses a tag that moved since the run started
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - name: Check COPR's queue, then send the webhook
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 .github/scripts/copr_watch.py trigger

  aur-bin:
    name: Deploy archtoys-bin to AUR
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set pkgver from tag
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur-archtoys-bin/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/aur-archtoys-bin/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: archtoys-bin
          pkgbuild: ./packaging/aur-archtoys-bin/PKGBUILD
          commit_username: Mujtaba1i
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          updpkgsums: true
          # Actually runs makepkg on the PKGBUILD before pushing, so a broken
          # package never reaches the AUR. Cheap here: it only unpacks a tarball.
          test: true

  aur-source:
    name: Deploy archtoys to AUR
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set pkgver from tag
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur-archtoys/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/aur-archtoys/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: archtoys
          pkgbuild: ./packaging/aur-archtoys/PKGBUILD
          commit_username: Mujtaba1i
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          updpkgsums: true
          # To also test-compile before pushing (slower, ~10+ min), uncomment:
          # test: true
          # test_flags: --clean --cleanbuild --syncdeps --noconfirm

  # Hands the RPMs over to the COPR watcher, a separate workflow: COPR can queue
  # for hours, and waiting in here would keep this whole run open.
  copr-watch:
    name: Start the COPR watcher
    needs: [prepare, publish-release, trigger-copr]
    runs-on: ubuntu-latest
    permissions:
      actions: write    # start another workflow
    steps:
      - name: Start the watcher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh workflow run copr-watch.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f sha="$SHA" -f started="$(date +%s)"
          echo "COPR watcher started for $TAG. It follows COPR's build, attaches the RPMs by itself, and opens an issue only if COPR needs your attention." >> "$GITHUB_STEP_SUMMARY"

  # Always runs last. Writes a summary table on the run page; if anything
  # failed, opens an issue naming the job + step, with the error log.
  report:
    name: Report
    if: always()
    needs: [wait-for-ci, prepare, build-tarball, build-appimage, build-deb, publish-release, trigger-copr, aur-bin, aur-source, copr-watch, attach-deb, apt-repo]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # read the failed job's log
      issues: write     # open / close the failure issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the pushed commit: "prepare" moves the tag to the release commit,
          # and checkout v7 refuses a tag that moved since the run started
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - name: Summarise and report failures
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/report.py
