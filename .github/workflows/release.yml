# The whole release, started by pushing a tag like v1.2.3. You only:
#
#     git tag v1.2.3
#     git push origin main v1.2.3
#
#   wait-for-ci ── prepare ──┬─ build-tarball ──┐
#                            ├─ build-appimage ─┴─ publish-release ─┬─ aur-bin
#                            │                                      ├─ aur-source
#                            └─ trigger-copr ───────────────────────┴─ rpms (release-rpm.yml)
#   report (always runs last: summary table; opens an issue if anything failed)
#
# "wait-for-ci" waits until CI has passed for the tagged commit, so you can
# push commits and the tag together; if CI fails, nothing is changed.
# "prepare" sets the version in Cargo.toml / Cargo.lock / archtoys.spec,
# writes the changelog from your commit messages since the previous tag,
# commits "Release v1.2.3" to main and moves the tag onto that commit.
# Every later job builds that commit.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Name used in archtoys.spec %changelog entries
  PACKAGER: "Mujtaba1i <mujtaba1i@github>"

jobs:
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read     # read the CI run's status
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-ci.sh

  prepare:
    name: Bump version + changelog
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the "Release vX" commit and moves the tag
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      notes: ${{ steps.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0     # full history + tags, for the changelog

      - id: prepare
        run: bash .github/scripts/prepare-release.sh

  build-tarball:
    name: Test + build binary tarball
    needs: prepare
    # Oldest supported Ubuntu LTS, so the binary runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      # The AppImage catalog (and older distros) run on Ubuntu 22.04 = glibc 2.35.
      # Fail here rather than ship a binary that crashes on those systems.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T target/release/archtoys | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "Binary requires glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::Binary needs glibc $NEED, newer than 2.35 (Ubuntu 22.04). Build on ubuntu-22.04."
            exit 1
          fi

      # Ships the binary plus LICENSE, .desktop and icons, so the archtoys-bin
      # PKGBUILD can take everything from this one download.
      - name: Create release archive
        run: |
          mkdir -p staging
          install -Dm755 target/release/archtoys      staging/archtoys
          install -Dm644 LICENSE                      staging/LICENSE
          install -Dm644 packaging/archtoys.desktop   staging/archtoys.desktop
          cp packaging/archtoys.png packaging/archtoys-*.png staging/
          (cd staging && tar -czf ../archtoys-linux-x86_64.tar.gz *)
          tar -tzf archtoys-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: archtoys-linux-x86_64.tar.gz
          if-no-files-found: error

  build-appimage:
    name: Build + smoke-test AppImage
    needs: prepare
    # Oldest supported Ubuntu LTS: the AppImage catalog tests on 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libxkbcommon*, libxcursor1, libxi6, libxrender1: bundled into the AppImage
          # xvfb: for the smoke test
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev curl \
            libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxi6 libxrender1 xvfb

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build AppImage
        run: |
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh "${{ needs.prepare.outputs.version }}"

      # The AppImage catalog (and older distros) run on Ubuntu 22.04 = glibc 2.35.
      # Checks the binary AND the libraries bundled next to it.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T dist/AppDir/usr/bin/archtoys-bin dist/AppDir/usr/lib/*.so* 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "AppImage contents require glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::AppImage needs glibc $NEED, newer than 2.35 (Ubuntu 22.04). Build on ubuntu-22.04."
            exit 1
          fi

      # Start the finished AppImage on a virtual screen and make sure it is
      # still running after 10 seconds, like the AppImage catalog's test.
      - name: Smoke test AppImage
        run: |
          APPIMAGE="$(ls dist/Archtoys-*-x86_64.AppImage)"
          chmod +x "$APPIMAGE"
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$(mktemp -d)"
          Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:99 "$APPIMAGE" > smoke.log 2>&1 &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "AppImage is still running after 10 s: OK"
            kill "$APP_PID" || true
            kill "$XVFB_PID" || true
          else
            echo "::error::The AppImage exited within 10 seconds. Its output:"
            cat smoke.log
            kill "$XVFB_PID" || true
            exit 1
          fi
          cat smoke.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: dist/Archtoys-*-x86_64.AppImage
          if-no-files-found: error

  # The only job that creates/edits the GitHub release, so two jobs can never
  # race to create it.
  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-tarball, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Archtoys ${{ github.ref_name }}
          body: ${{ needs.prepare.outputs.notes }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # Starts COPR's build once the release commit and tag exist. (A GitHub
  # webhook would fire on the tag push, before the version is bumped.)
  trigger-copr:
    name: Start COPR build
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Call COPR custom webhook
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::error::Secret COPR_WEBHOOK_URL is missing (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          CODE="$(curl -sS -o response.txt -w '%{http_code}' -X POST "$COPR_WEBHOOK_URL")"
          echo "COPR answered HTTP $CODE: $(head -c 300 response.txt)"
          case "$CODE" in
            2*) echo "COPR build started." ;;
            *)  echo "::error::COPR did not accept the webhook (HTTP $CODE). Check the COPR_WEBHOOK_URL secret."; exit 1 ;;
          esac

  aur-bin:
    name: Deploy archtoys-bin to AUR
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set pkgver from tag
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur-archtoys-bin/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/aur-archtoys-bin/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3.0.1
        with:
          pkgname: archtoys-bin
          pkgbuild: ./packaging/aur-archtoys-bin/PKGBUILD
          commit_username: Mujtaba1i
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          updpkgsums: true
          # Actually runs makepkg on the PKGBUILD before pushing, so a broken
          # package never reaches the AUR. Cheap here: it only unpacks a tarball.
          test: true

  aur-source:
    name: Deploy archtoys to AUR
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set pkgver from tag
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur-archtoys/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/aur-archtoys/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3.0.1
        with:
          pkgname: archtoys
          pkgbuild: ./packaging/aur-archtoys/PKGBUILD
          commit_username: Mujtaba1i
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          updpkgsums: true
          # To also test-compile before pushing (slower, ~10+ min), uncomment:
          # test: true
          # test_flags: --clean --cleanbuild --syncdeps --noconfirm

  rpms:
    name: Attach COPR RPMs
    needs: [prepare, publish-release, trigger-copr]
    permissions:
      contents: write
    uses: ./.github/workflows/release-rpm.yml
    with:
      tag: ${{ github.ref_name }}

  # Always runs last. Writes a summary table on the run page; if anything
  # failed, opens an issue naming the job + step, with the error log.
  report:
    name: Report
    if: always()
    needs: [wait-for-ci, prepare, build-tarball, build-appimage, publish-release, trigger-copr, aur-bin, aur-source, rpms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # read the failed job's log
      issues: write     # open / close the failure issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - name: Summarise and report failures
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/report.py
