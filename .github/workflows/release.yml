# The whole release, started by pushing a tag like v1.2.3. You only:
#
#     git tag v1.2.3
#     git push origin main v1.2.3
#
#   wait-for-ci ── prepare ──┬─ build-tarball ──┐
#                            ├─ build-appimage ─┴─ publish-release ─┬─ aur-bin
#                            │                                      ├─ aur-source
#                            ├─ trigger-copr ───────────────────────┴─ copr-watch
#                            └─ build-deb ── (optional) ─ attach-deb (after publish-release)
#   report (always runs last: summary table; opens an issue if anything failed)
#
# Required parts stop the release if they fail. Optional parts (the .deb) never
# do: the release is still published, and the report tells you what is missing.
# COPR can queue for hours, so "copr-watch" only starts a separate workflow
# (copr-watch.yml) that follows COPR's build and attaches the RPMs by itself.
#
# "wait-for-ci" waits until CI has passed for the tagged commit, so you can
# push commits and the tag together; if CI fails, nothing is changed.
# "prepare" sets the version in Cargo.toml / Cargo.lock / archtoys.spec,
# writes the changelog from your commit messages since the previous tag,
# commits "Release v1.2.3" to main and moves the tag onto that commit.
# Every later job builds that commit.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Name used in archtoys.spec %changelog entries
  PACKAGER: "Mujtaba1i <mujtaba1i@github>"

jobs:
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read     # read the CI run's status
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/wait-for-ci.sh

  prepare:
    name: Bump version + changelog
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the "Release vX" commit and moves the tag
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      sha: ${{ steps.prepare.outputs.sha }}
      notes: ${{ steps.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0     # full history + tags, for the changelog

      - id: prepare
        run: bash .github/scripts/prepare-release.sh

  build-tarball:
    name: Build binary tarball
    needs: prepare
    # Oldest supported Ubuntu LTS, so the binary runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # A release runs on a tag, and a tag can never read an earlier tag's cache, so
      # saving one here only fills GitHub's 10 GB cache storage.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: false

      # No `cargo test` here: CI already ran the tests on this code, and the
      # release waits for CI to pass first (the wait-for-ci job).
      - name: Build release binary
        run: cargo build --release --locked

      # The AppImage catalog (and older distros) run on Ubuntu 22.04 = glibc 2.35.
      # Fail here rather than ship a binary that crashes on those systems.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T target/release/archtoys | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "Binary requires glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::Binary needs glibc $NEED, newer than 2.35 (Ubuntu 22.04). Build on ubuntu-22.04."
            exit 1
          fi

      # Ships the binary plus LICENSE, .desktop and icons, so the archtoys-bin
      # PKGBUILD can take everything from this one download.
      - name: Create release archive
        run: |
          mkdir -p staging
          install -Dm755 target/release/archtoys      staging/archtoys
          install -Dm644 LICENSE                      staging/LICENSE
          install -Dm644 data/colornames-LICENSE.txt  staging/colornames-LICENSE.txt
          install -Dm644 packaging/archtoys.desktop   staging/archtoys.desktop
          cp packaging/archtoys.png packaging/archtoys-*.png staging/
          (cd staging && tar -czf ../archtoys-linux-x86_64.tar.gz *)
          tar -tzf archtoys-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: archtoys-linux-x86_64.tar.gz
          if-no-files-found: error

  build-appimage:
    name: Build + smoke-test AppImage
    needs: prepare
    # Oldest supported Ubuntu LTS: the AppImage catalog tests on 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libxkbcommon*, libxcursor1, libxi6, libxrender1: bundled into the AppImage
          # xvfb: for the smoke test
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev curl \
            libxkbcommon0 libxkbcommon-x11-0 libxcursor1 libxi6 libxrender1 xvfb

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # A release runs on a tag, and a tag can never read an earlier tag's cache, so
      # saving one here only fills GitHub's 10 GB cache storage.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: false

      - name: Build AppImage
        run: |
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh "${{ needs.prepare.outputs.version }}"

      # The AppImage catalog (and older distros) run on Ubuntu 22.04 = glibc 2.35.
      # Checks the binary AND the libraries bundled next to it.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T dist/AppDir/usr/bin/archtoys-bin dist/AppDir/usr/lib/*.so* 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "AppImage contents require glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::AppImage needs glibc $NEED, newer than 2.35 (Ubuntu 22.04). Build on ubuntu-22.04."
            exit 1
          fi

      # Start the finished AppImage on a virtual screen and make sure it is
      # still running after 10 seconds, like the AppImage catalog's test.
      - name: Smoke test AppImage
        run: |
          APPIMAGE="$(ls dist/Archtoys-*-x86_64.AppImage)"
          chmod +x "$APPIMAGE"
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$(mktemp -d)"
          Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
          XVFB_PID=$!
          sleep 2
          DISPLAY=:99 "$APPIMAGE" > smoke.log 2>&1 &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "AppImage is still running after 10 s: OK"
            kill "$APP_PID" || true
            kill "$XVFB_PID" || true
          else
            echo "::error::The AppImage exited within 10 seconds. Its output:"
            cat smoke.log
            kill "$XVFB_PID" || true
            exit 1
          fi
          cat smoke.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage
          path: dist/Archtoys-*-x86_64.AppImage
          if-no-files-found: error

  # OPTIONAL. If anything in here fails, the release is still published and the
  # report says only the .deb is missing. Every step has its own name because
  # the failure report explains each one.
  build-deb:
    name: Build + test the .deb (optional)
    needs: prepare
    # Oldest supported Ubuntu LTS, so one .deb works on Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libx11-dev libxcb-shm0-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # A release runs on a tag, and a tag can never read an earlier tag's cache, so
      # saving one here only fills GitHub's 10 GB cache storage.
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          save-if: false

      - name: Install the packaging tool
        run: cargo install cargo-deb --locked --version 3.8.0

      - name: Build the app
        run: cargo build --release --locked

      # Same rule as the other builds: nothing newer than Ubuntu 22.04's glibc.
      - name: Check required glibc (max 2.35)
        run: |
          NEED="$(objdump -T target/release/archtoys | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "Binary requires glibc $NEED"
          if [ "$(printf '%s\n' "$NEED" 2.35 | sort -V | tail -n 1)" != "2.35" ]; then
            echo "::error::Binary needs glibc $NEED, newer than 2.35 (Ubuntu 22.04)."
            exit 1
          fi

      - name: Create the .deb
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo deb --no-build --deb-revision "" --output "archtoys_${VERSION}_amd64.deb"
          ls -la archtoys_*.deb

      - name: Check dependencies and files
        run: bash .github/scripts/check-deb.sh archtoys_*.deb

      # A clean Ubuntu with nothing installed, like a new user's machine.
      - name: Install on a clean Ubuntu
        run: |
          docker run -d --name clean ubuntu:22.04 sleep 3600
          docker cp archtoys_*.deb clean:/tmp/archtoys.deb
          docker exec clean bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /tmp/archtoys.deb xvfb'

      # The installed app must still be running after 10 seconds, like the
      # AppImage smoke test.
      - name: Start the installed app
        run: |
          docker exec clean bash -c '
            export HOME="$(mktemp -d)"
            Xvfb :99 -screen 0 800x600x24 >/dev/null 2>&1 &
            sleep 2
            DISPLAY=:99 archtoys > /tmp/smoke.log 2>&1 &
            APP=$!
            sleep 10
            if kill -0 "$APP" 2>/dev/null; then
              echo "The installed app is still running after 10 s: OK"
            else
              echo "::error::The installed app exited within 10 seconds. Its output:"
              cat /tmp/smoke.log
              exit 1
            fi
            cat /tmp/smoke.log'

      - name: Clean up
        if: always()
        run: docker rm -f clean || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: archtoys_*.deb
          if-no-files-found: error

  # The only job that creates/edits the GitHub release, so two jobs can never
  # race to create it.
  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-tarball, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Archtoys ${{ github.ref_name }}
          body: ${{ needs.prepare.outputs.notes }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # OPTIONAL. Adds the .deb to the release once it exists. Skipped when the
  # .deb failed to build.
  attach-deb:
    name: Attach the .deb to the release (optional)
    needs: [publish-release, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: deb

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" deb/*.deb --repo "$GITHUB_REPOSITORY" --clobber

  # Starts COPR's build once the release commit and tag exist. It first looks
  # at COPR's queue: a build of this release that is already queued or running
  # (for example you pressed Rebuild yourself) means no second build is sent, and
  # an older build still in the queue is named in the summary.
  trigger-copr:
    name: Start COPR build
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - name: Check COPR's queue, then send the webhook
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 .github/scripts/copr_watch.py trigger

  aur-bin:
    name: Deploy archtoys-bin to AUR
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set pkgver from tag
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur-archtoys-bin/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/aur-archtoys-bin/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3.0.1
        with:
          pkgname: archtoys-bin
          pkgbuild: ./packaging/aur-archtoys-bin/PKGBUILD
          commit_username: Mujtaba1i
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          updpkgsums: true
          # Actually runs makepkg on the PKGBUILD before pushing, so a broken
          # package never reaches the AUR. Cheap here: it only unpacks a tarball.
          test: true

  aur-source:
    name: Deploy archtoys to AUR
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set pkgver from tag
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur-archtoys/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/aur-archtoys/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3.0.1
        with:
          pkgname: archtoys
          pkgbuild: ./packaging/aur-archtoys/PKGBUILD
          commit_username: Mujtaba1i
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          updpkgsums: true
          # To also test-compile before pushing (slower, ~10+ min), uncomment:
          # test: true
          # test_flags: --clean --cleanbuild --syncdeps --noconfirm

  # Hands the RPMs over to the COPR watcher, a separate workflow: COPR can queue
  # for hours, and waiting in here would keep this whole run open.
  copr-watch:
    name: Start the COPR watcher
    needs: [prepare, publish-release, trigger-copr]
    runs-on: ubuntu-latest
    permissions:
      actions: write    # start another workflow
    steps:
      - name: Start the watcher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh workflow run copr-watch.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f sha="$SHA" -f started="$(date +%s)"
          echo "COPR watcher started for $TAG. It follows COPR's build, attaches the RPMs by itself, and opens an issue only if COPR needs your attention." >> "$GITHUB_STEP_SUMMARY"

  # Always runs last. Writes a summary table on the run page; if anything
  # failed, opens an issue naming the job + step, with the error log.
  report:
    name: Report
    if: always()
    needs: [wait-for-ci, prepare, build-tarball, build-appimage, build-deb, publish-release, trigger-copr, aur-bin, aur-source, copr-watch, attach-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read     # read the failed job's log
      issues: write     # open / close the failure issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/scripts

      - name: Summarise and report failures
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/report.py
