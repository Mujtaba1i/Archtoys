# Dependabot: once a week, one pull request for the Rust libraries and one for
# the GitHub Actions (their pinned commits). CI runs on each, including the
# benchmark against main. Merged, they go in the release notes' folded
# "Technical updates (by Dependabot)" panel (release_notes.py).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # libraries Archtoys uses through others too (most of the lock file),
    # not only the ones in Cargo.toml
    allow:
      - dependency-type: all
    groups:
      # a new major version can need code changes: it comes as its own pull
      # request, so it never holds back the others
      rust-libraries:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # zbus 6 removed zbus::blocking, which Archtoys uses: moving to it is planned work
      - dependency-name: "zbus"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Bump"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
