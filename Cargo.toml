[package]
name = "archtoys"
version = "0.7.4"
edition = "2021"
description = "PowerToys-style tools for Linux: color picker, text extractor, screen ruler"
license = "MIT"
repository = "https://github.com/Mujtaba1i/Archtoys"
readme = "README.md"


[features]
default = ["cpu"]
# How the window is drawn: on the CPU (the default: Slint's software renderer,
# about a third of OpenGL's memory, same frame rate), or with OpenGL
# (cargo build --release --no-default-features --features opengl). Both
# together: OpenGL.
opengl = ["slint/renderer-femtovg"]
cpu = ["slint/renderer-software"]

[dependencies]
slint = { version = "1.15.0", default-features = false, features = ["backend-winit", "compat-1-2", "unstable-winit-030"] }
# text only: copying images needs extra crates the app never uses
arboard = { version = "3.2", default-features = false }
global-hotkey = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ksni = { version = "0.3.3", default-features = false, features = ["blocking", "async-io"] }
# the same version Slint uses, so it is compiled once
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.14.0", features = ["randr"] }
zbus = "5.13.2"
# which language a text is in (Text Extractor); pure Rust, MIT
whatlang = "0.18"

[profile.release]
# No symbol tables in the binary: 28% smaller (27.6 MB -> 19.8 MB) at no build
# cost.
strip = true
# One code unit: the optimizer sees all of it, 12% smaller (v0.7.0: 27.2 MB ->
# 24.1 MB) for about 5% more build time. Thin LTO made it bigger, full LTO
# saves less and doubles the build time; panic = "abort" would save 2 MB more,
# but a panic in a background thread would then close the whole app.
codegen-units = 1


# How the .deb is built (cargo-deb). Used by the optional "Build + test the .deb"
# job of .github/workflows/release.yml. Keep "depends" in step with
# .github/scripts/check-deb.sh.
[package.metadata.deb]
maintainer = "Mujtaba1i <Mujtaba1i@users.noreply.github.com>"
copyright = "2026, Mujtaba1i"
license-file = ["LICENSE", "0"]
extended-description = """\
Archtoys picks any pixel on your screen, shows it magnified, names it, and \
copies it as HEX, RGB, HSL, HSV and more. It works on Wayland and X11 and is \
inspired by the Color Picker in Microsoft PowerToys."""
section = "graphics"
priority = "optional"
# $auto = the libraries the program links to; the rest are loaded while it runs.
depends = "$auto, libx11-6, libxkbcommon0, libxkbcommon-x11-0, libxcursor1, libxi6, libxrender1, libgl1, libegl1, libwayland-client0, libwayland-egl1"
recommends = "xdg-desktop-portal, hicolor-icon-theme"
# Text Extractor (v0.7.0); Archtoys can also install it when it is turned on
suggests = "tesseract-ocr"
assets = [
    ["target/release/archtoys", "usr/bin/archtoys", "755"],
    ["packaging/archtoys.desktop", "usr/share/applications/archtoys.desktop", "644"],
    # what KDE Discover and GNOME Software show (v0.7.3)
    ["packaging/io.github.Mujtaba1i.Archtoys.metainfo.xml", "usr/share/metainfo/io.github.Mujtaba1i.Archtoys.metainfo.xml", "644"],
    ["packaging/archtoys-16.png", "usr/share/icons/hicolor/16x16/apps/archtoys.png", "644"],
    ["packaging/archtoys-22.png", "usr/share/icons/hicolor/22x22/apps/archtoys.png", "644"],
    ["packaging/archtoys-24.png", "usr/share/icons/hicolor/24x24/apps/archtoys.png", "644"],
    ["packaging/archtoys-32.png", "usr/share/icons/hicolor/32x32/apps/archtoys.png", "644"],
    ["packaging/archtoys-48.png", "usr/share/icons/hicolor/48x48/apps/archtoys.png", "644"],
    ["packaging/archtoys-64.png", "usr/share/icons/hicolor/64x64/apps/archtoys.png", "644"],
    ["packaging/archtoys-128.png", "usr/share/icons/hicolor/128x128/apps/archtoys.png", "644"],
    ["packaging/archtoys-256.png", "usr/share/icons/hicolor/256x256/apps/archtoys.png", "644"],
    ["packaging/archtoys-512.png", "usr/share/icons/hicolor/512x512/apps/archtoys.png", "644"],
    ["packaging/archtoys.png", "usr/share/icons/hicolor/1024x1024/apps/archtoys.png", "644"],
    ["data/colornames-LICENSE.txt", "usr/share/doc/archtoys/colornames-LICENSE.txt", "644"],
    ["README.md", "usr/share/doc/archtoys/README.md", "644"],
]
